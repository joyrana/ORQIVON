name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  DATABASE_URL: postgresql+psycopg://sdlc:sdlc@localhost:5432/sdlc_test

jobs:
  backend:
    name: Backend (lint, types, tests, evals)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sdlc
          POSTGRES_PASSWORD: sdlc
          POSTGRES_DB: sdlc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sdlc" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        run: |
          # Created as the runner user: later steps run some tools under sudo.
          mkdir -p var/logs var/reports
          {
            set -x
            python --version
            python -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -e "services/api[dev]"
          } 2>&1 | tee var/logs/install.log
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Sandbox toolchain (namespace sandbox needs root)
        run: |
          sudo make sandbox-toolchain
          # Go and Node run inside the sandbox: their roots must be root-owned with no ACLs.
          for tool in go node; do
            root=$(dirname "$(dirname "$(readlink -f "$(command -v $tool)")")")
            sudo chown -R root:root "$root"
            if command -v setfacl >/dev/null; then sudo setfacl -R -b "$root"; fi
            sudo chmod -R go-w "$root"
          done
      - name: Ruff
        working-directory: services/api
        run: |
          ../../.venv/bin/ruff check src tests migrations
          ../../.venv/bin/ruff format --check src tests migrations
      - name: Mypy
        working-directory: services/api
        run: ../../.venv/bin/mypy src
      - name: Migrations match the ORM
        working-directory: services/api
        run: |
          ../../.venv/bin/alembic upgrade head
          ../../.venv/bin/alembic check
      - name: Tests (as root so sandboxed execution is exercised, not skipped)
        working-directory: services/api
        run: |
          sudo --preserve-env=DATABASE_URL,PATH ../../.venv/bin/python -m pytest -rs \
            --junitxml=../../var/reports/pytest.xml 2>&1 | tee ../../var/logs/pytest.log
      - name: Fail if sandbox or backup tests were skipped
        run: |
          if grep -q 'needs root and unshare\|needs the namespace sandbox\|sandbox toolchain missing\|PostgreSQL client tools missing' var/reports/pytest.xml; then
            echo "Sandbox or backup tests were skipped in CI"; exit 1
          fi
      - name: Sandbox works with only the capabilities the Helm chart grants the worker
        working-directory: services/api
        run: |
          sudo --preserve-env=DATABASE_URL,PATH ../../scripts/with-worker-caps.sh \
            ../../.venv/bin/python -m pytest -q tests/security/test_sandbox.py \
            tests/integration/test_multilanguage_runner.py 2>&1 | tee ../../var/logs/worker-caps.log
      - name: Offline evaluations against baselines
        run: |
          .venv/bin/python -m agentic_sdlc.evals.run --all --report var/reports/evals.json 2>&1 \
            | tee var/logs/evals.log
      - name: OpenAPI document is current
        working-directory: services/api
        run: |
          APP_ENV=test ../../.venv/bin/agentic-sdlc openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json
      - name: Dependency audit
        run: |
          .venv/bin/pip install pip-audit
          .venv/bin/pip-audit --skip-editable
      - name: Surface failure output as annotations
        if: failure()
        run: |
          # One annotation per log (GitHub shows at most 10 per step); %0A keeps the line breaks.
          for f in var/logs/*.log; do
            [ -f "$f" ] || continue
            body=$(tail -n 60 "$f" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$(basename "$f")::${body}"
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-reports
          path: |
            var/reports/
            var/logs/

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Typed client matches the OpenAPI document
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  licences:
    name: Third-party licence policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install runtime dependencies only
        run: |
          python -m venv .venv
          .venv/bin/pip install -e services/api
          cd apps/web && npm ci
      - name: Every shipped component is on the licence allow-list
        run: .venv/bin/python scripts/licenses.py --check

  e2e:
    name: Browser E2E (vertical slice)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sdlc
          POSTGRES_PASSWORD: sdlc
          POSTGRES_DB: sdlc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sdlc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sdlc:sdlc@localhost:5432/sdlc
      APP_ENV: development
      DATA_DIR: /var/tmp/asw-e2e-data
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "services/api"
          sudo make sandbox-toolchain
          cd apps/web && npm ci && npx playwright install --with-deps chromium
      - name: Migrate and seed development users
        run: |
          (cd services/api && ../../.venv/bin/alembic upgrade head)
          .venv/bin/agentic-sdlc seed
      - name: Start API and worker (worker as root for the namespace sandbox)
        run: |
          mkdir -p var/logs
          nohup .venv/bin/agentic-sdlc api --port 8000 > var/logs/api.log 2>&1 &
          sudo --preserve-env=DATABASE_URL,APP_ENV,DATA_DIR,PATH nohup .venv/bin/agentic-sdlc worker > var/logs/worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/health && break; sleep 1; done
      - name: Build and run Playwright
        working-directory: apps/web
        run: |
          npm run build
          npx playwright test
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-reports
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            var/logs/

  devscripts:
    name: Local developer scripts (setup.sh, dev.sh)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sdlc
          POSTGRES_PASSWORD: sdlc
          POSTGRES_DB: sdlc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sdlc" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Lint the scripts
        run: shellcheck -x setup.sh dev.sh
      - name: setup.sh on a clean machine, then again (must be a no-op)
        run: |
          ./setup.sh
          ./setup.sh | tee second-run.txt
          grep -q "Python packages up to date" second-run.txt
          grep -q "Keeping existing services/api/.env" second-run.txt
      - name: dev.sh --debug serves the app, runs the delivery flow and stops cleanly
        run: |
          ./dev.sh --debug > dev.log 2>&1 < /dev/null &
          for _ in $(seq 1 90); do grep -q "ORQIVON is running" dev.log && break; sleep 1; done
          curl -fsS http://localhost:5173/api/v1/health
          curl -fsS http://localhost:5173/ | grep -q "<title>ORQIVON</title>"
          python3 -c "import socket; [socket.create_connection(('127.0.0.1', p), timeout=5).close() for p in (5678, 5679)]"
          .venv/bin/python scripts/smoke_slice.py --base-url http://localhost:8000
          grep -q "DEBUG   agentic_sdlc.delivery: stage started" var/logs/worker.log
          kill -INT "$(pgrep -f 'bash ./dev.sh' | head -1)"
          sleep 8
          if pgrep -af 'agentic-sdlc|vite'; then echo "processes left running after Ctrl-C"; exit 1; fi
      - if: failure()
        run: cat dev.log || true
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: devscripts-logs
          path: var/logs/

  helm:
    name: Helm chart (render, schema, policy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install validators
        run: pip install pyyaml kubernetes-validate
      - name: Render with the bundled renderer, validate schemas and policy
        run: python scripts/helm_check.py
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint infrastructure/helm/agentic-sdlc --strict
      - name: Render with helm itself, validate schemas and policy
        run: python scripts/helm_check.py

  images:
    name: Container images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f infrastructure/docker/api.Dockerfile -t agentic-sdlc-api:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/web.Dockerfile -t agentic-sdlc-web:ci .

  compose:
    name: Compose stack smoke (vertical slice over HTTP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the web entry point
        run: |
          for i in $(seq 1 90); do
            curl -sf localhost:8080/api/v1/health && exit 0
            sleep 2
          done
          exit 1
      - name: Drive the 15-step slice through nginx → API → worker → sandbox
        run: |
          mkdir -p var/logs
          python3 scripts/smoke_slice.py --base-url http://localhost:8080 --timeout 600 2>&1 \
            | tee var/logs/smoke.log
      - name: Stack logs
        if: always()
        run: |
          mkdir -p var/logs
          docker compose logs --no-color worker > var/logs/worker.log 2>&1 || true
          docker compose logs --no-color api > var/logs/api.log 2>&1 || true
          for f in var/logs/*.log; do
            body=$(tail -n 60 "$f" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=$(basename "$f")::${body}"
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: compose-logs
          path: var/logs/
