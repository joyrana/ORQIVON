id: acceptance-test-generation
version: 1.0.0
name: Acceptance test generation
description: >-
  Write an independent acceptance suite from the approved acceptance criteria and the repository at
  the base commit, before any implementation exists. Each test names the criterion it verifies. The
  suite is owned by QA: the Developer agent never sees it, and it is stored by content hash so every
  repair attempt is judged by the same tests.
category: testing
triggers:
  intents: [test]
  workflow_stages: [qa_tests]
agents: [qa]
required_context: [approved_plan, repository, acceptance_criteria]
postconditions: [suite_policy]
tools: [repo.read]
strategies: [llm]
model:
  task: test_generation
  capabilities: [code, structured_output]
  expected_output_tokens: 4000
budgets: { max_input_tokens: 30000, max_output_tokens: 8000, max_model_calls: 3 }
timeout_s: 300
retry: { max_attempts: 3, backoff_s: 1 }
approval_level: none
evaluation:
  suite: coding
  success_criteria: { criteria_coverage: 0.9 }
implementation: agentic_sdlc.skills_impl.delivery:AcceptanceTestGeneration
provenance: { owner: platform, created: "2026-11-12" }
input_schema:
  type: object
  additionalProperties: false
  required: [repository_id, base_commit, criteria, plan_files]
  properties:
    repository_id: { type: string, format: uuid }
    base_commit: { type: string, pattern: "^[0-9a-f]{40}$" }
    criteria:
      type: array
      minItems: 1
      items: { type: object, required: [key, text] }
    plan_files: { type: array, items: { type: string } }
    approach: { type: string }
output_schema:
  type: object
  additionalProperties: false
  required: [files, coverage, notes]
  properties:
    files:
      type: array
      minItems: 1
      maxItems: 10
      items:
        type: object
        additionalProperties: false
        required: [path, content]
        properties:
          path: { type: string, pattern: "^test_[a-z0-9_]{1,60}\\.py$" }
          content: { type: string, minLength: 1, maxLength: 60000 }
    coverage:
      type: array
      items:
        type: object
        required: [criterion_key, tests]
        properties:
          criterion_key: { type: string }
          tests: { type: array, items: { type: string } }
    notes: { type: array, items: { type: string } }
