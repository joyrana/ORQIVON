{{- if .Values.networkPolicy.enabled }}
# Only the ingress controller (and the web pods) reach the API; nothing reaches the worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asw.fullname" . }}-api
  labels:
    {{- include "asw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "asw.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        - podSelector:
            matchLabels:
              {{- include "asw.selector" . | nindent 14 }}
              app.kubernetes.io/component: web
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asw.fullname" . }}-web
  labels:
    {{- include "asw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "asw.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asw.fullname" . }}-worker
  labels:
    {{- include "asw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "asw.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes: [Ingress]
  ingress: []
{{- end }}
